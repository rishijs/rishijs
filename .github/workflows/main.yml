name: GitHub Metrics & Trophies Hybrid

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Core GitHub Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: rishijs
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          
          plugin_achievements: no
          plugin_habits: no

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pull latest remote changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Fetch and pull, forcing git to overwrite local workspace changes if any exist
          git fetch origin main
          git reset --hard origin/main
      
      - name: Remove old trophies and fetch new trophies
        run: |
          # Remove the file explicitly from git tracking and disk
          git rm -f trophy.svg || rm -f trophy.svg
          
          # Download the fresh SVG
          curl -s "https://github-profile-trophy-fork-two.vercel.app/?username=rishijs&theme=dracula&margin-w=15&margin-h=15&rank=SECRET,SSS,SS,S,A,B" -o trophy.svg
      
      - name: Commit and Push Changes
        run: |
          git add trophy.svg
          # The || true prevents the workflow from failing if your trophies didn't actually change rank/count
          git commit -m "Internal: Update profile metrics and trophy assets [skip ci]" || echo "No changes to commit"
          git push origin main
