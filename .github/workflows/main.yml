name: GitHub Metrics & Trophies Hybrid

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Core GitHub Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: rishijs
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          
          plugin_achievements: no
          plugin_habits: no

