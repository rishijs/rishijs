name: GitHub Metrics

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@master

        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: rishijs

          template: classic
          base: header, activity, community, repositories, metadata
          
          # Deprecated metrics
          plugin_achievements: no
          plugin_habits: no
